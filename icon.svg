<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#064e3b"/>
      <stop offset="100%" style="stop-color:#047857"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background — deep green -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Subtle top-right glow -->
  <circle cx="105" cy="25" r="50" fill="rgba(167,139,250,0.12)"/>
  <!-- Shield shape — white translucent -->
  <path d="M64 18 L100 33 L100 63 C100 84 84 101 64 111 C44 101 28 84 28 63 L28 33 Z"
        fill="white" opacity="0.12"/>
  <!-- Lock body -->
  <rect x="46" y="64" width="36" height="27" rx="6" fill="white"/>
  <!-- Lock shackle -->
  <path d="M53 64 L53 53 C53 43 75 43 75 53 L75 64"
        fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Keyhole — purple accent -->
  <circle cx="64" cy="76" r="5" fill="url(#accent)"/>
  <rect x="61.5" y="76" width="5" height="7" rx="2.5" fill="url(#accent)"/>
</svg>
